<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/formulaire/form.css">
    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="../nav.css">

    <title>Le formulaire de la gloire</title>
</head>

<body>
    <!-- navbar.html -->
    <nav class="navbar" id="nird-navbar">
        <div class="navbar-container navbar-content">
            <div class="navbar-brand">
                <span class="logo">🛡️
                </span>
                <span class="brand-name">Les chômeurs </span>
            </div>
            <ul class="navbar-menu" id="navbarMenu">
                <li><a href="../index.html" class="nav-link active">Accueil</a></li>
                <li><a href="../snake/index.html" class="nav-link">Snake</a></li>
                <li><a href="../CCI/index.html" class="nav-link">Défi CCI</a></li>
                <li><a href="../ChatBot/index.html" class="nav-link">Défi Chat'bruti</a></li>
                <li><a href="../ergonomie/index.html" class="nav-link">Défi Ergonomie</a></li>
            </ul>
        </div>
    </nav>
    <div class="form-container">
        <div class="card">
            <h2>Un soucis</h2>
            <p>Informatique ? Reconditionnement ? Contactez-nous</p>

            <form id="ReportForm">
                <div class="form-group">
                    <label for="nom">Nom <span class="required">*</span></label>
                    <input type="text" id="nom" name="nom" required>
                </div>

                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="sujet">Sujet <span class="required">*</span></label>
                    <input type="text" id="sujet" name="sujet" required>
                </div>

                <div class="form-group">
                    <label for="message">Message <span class="required">*</span></label>
                    <textarea id="message" name="message" required></textarea>
                </div>

                <button type="submit">Envoyer</button>
            </form>
        </div>
    </div>

    <!-- Popup de confirmation -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-content">
            <div class="checkmark"></div>
            <h3>Message Envoyé !</h3>
            <p>Merci de nous avoir Reportés. Nous vous répondrons bientôt.</p>
            <button class="popup-close-btn" onclick="closePopup()">Fermer</button>
        </div>
    </div>

    <script src="./form.js"></script>

</body>

</html>
